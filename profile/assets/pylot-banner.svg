<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PyLoT Robotics — Build robots. Share what works.</title>
  <desc id="desc">A midnight-blue banner with cyan orbital paths, a robot face and gently twinkling stars.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#142642"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#62e8ef"/><stop offset="1" stop-color="#afa0ff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#38d7e5" stop-opacity=".18"/><stop offset="1" stop-color="#38d7e5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9abce5" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="971" cy="180" r="220" fill="url(#halo)"/>
  <path d="M32 64V32H64M1136 328H1168V296" fill="none" stroke="#62e8ef" stroke-opacity=".65" stroke-width="2"/>
  <g fill="none" stroke="#62e8ef">
