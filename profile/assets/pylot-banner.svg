    <ellipse cx="969" cy="174" rx="170" ry="66" transform="rotate(32 969 174)" stroke-opacity=".2"/>
    <circle cx="969" cy="174" r="111" stroke-opacity=".1" stroke-dasharray="3 9"/>
  </g>
  <g transform="translate(903 124)">
