    <circle cx="66" cy="-21" r="5" fill="#afa0ff"/>
    <rect width="132" height="96" rx="27" fill="#112c40" stroke="#75e9ef" stroke-width="2"/>
    <rect x="15" y="17" width="102" height="54" rx="16" fill="#071321"/>
    <path d="M36 42V48M96 42V48" stroke="#75e9ef" stroke-width="9" stroke-linecap="round"/>
    <path d="M54 58Q66 66 78 58" fill="none" stroke="#75e9ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 34V62M140 34V62" stroke="#afa0ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M47 115H85" stroke="#62e8ef" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
